<!DOCTYPE html>
<html lang="es">
<head>

<title>Contabilidad PGC PYMES</title>
<style>
  :root { --azul: #1f3864; --gris: #f3f4f6; --borde: #d0d5dd; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Arial, Helvetica, sans-serif; font-size: 14px; color: #111; background: #fff; display: flex; min-height: 100vh; }
  header { position: fixed; top: 0; left: 0; right: 0; height: 48px; background: var(--azul); color: #fff; display: flex; align-items: center; padding: 0 16px; z-index: 5; }
  header h1 { font-size: 16px; margin: 0; font-weight: bold; }
  header .logo { display: inline-flex; margin-right: 10px; } header .autor-cab { margin-left: auto; font-size: 12px; opacity: .9; } header .version { margin-left: 16px; font-size: 12px; opacity: .8; }
  .logo-grande { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; font-size: 18px; color: #1f3864; } .logo-grande svg { width: 56px; height: 56px; }
  .autor-bloque { max-width: 760px; } .autor-bloque label { display: block; margin-bottom: 8px; }
  .logo-menu { display: flex; align-items: center; gap: 8px; padding: 10px 12px 4px; font-weight: bold; color: #1f3864; }
  .logo-menu svg { width: 30px; height: 30px; }
  .cab-impr { display: flex; align-items: center; gap: 10px; color: #1f3864; font-weight: bold; margin-bottom: 6px; }
  .cab-impr svg { width: 36px; height: 36px; }
  .pie-impr { margin-top: 24px; font-size: 10px; color: #555; border-top: 1px solid #ccc; padding-top: 6px; }
  #lateral { width: 270px; margin-top: 48px; background: var(--gris); border-right: 1px solid var(--borde); padding: 8px 0; position: fixed; top: 48px; bottom: 0; overflow-y: auto; }
  #lateral details { border-bottom: 1px solid var(--borde); }
  #lateral summary { padding: 10px 14px; font-weight: bold; color: var(--azul); cursor: pointer; background: #e8ecf5; }
  #lateral a { display: block; padding: 8px 14px 8px 26px; color: #222; text-decoration: none; }
  #lateral a:hover { background: #dbe3f2; }
  #lateral a.act { background: var(--azul); color: #fff; }
  main { margin: 48px 0 0 270px; padding: 20px 28px; flex: 1; max-width: none; }
  .rejilla { display: grid; grid-template-columns: 1fr 1fr; gap: 0 24px; }
  .rejilla label.ancho { grid-column: 1 / -1; }

  input.dinero { text-align: right; width: 180px; min-width: 0; }
  label.opcion { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  label.opcion input, label.casilla input { display: inline-block; width: auto; min-width: 0; margin: 0; padding: 0; }
  label.casilla { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  .centro { max-width: 980px; margin: 0 auto; }

  table.balance th.nota { text-align: center; width: 70px; }

  ul.leyenda { list-style: none; padding: 0; }

  .pista { background: #fff8e1; border-left: 4px solid #f9a825; padding: 8px 12px; margin: 8px 0; }
  .ejer-menu { padding: 6px 6px 10px; } .ejer-menu select { width: 100%; margin: 4px 0; } .ejer-menu button { width: 100%; margin-top: 4px; }
  a.volver { display: block; padding: 8px 6px; font-weight: bold; }
  .emp { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }

  th, td { border-bottom: 1px solid var(--borde); padding: 6px 8px; text-align: left; vertical-align: top; }

    header, #lateral, button, input, select, .card, label { display: none !important; }

    table { font-size: 11px; }
  }

  /* Diálogos y avisos propios */
  dialog.dlg { border: 1px solid var(--borde); border-radius: 8px; padding: 20px; max-width: 460px; width: calc(100% - 32px); box-shadow: 0 8px 30px rgba(0,0,0,.25); color: #111; }
  dialog.dlg::backdrop { background: rgba(15,23,42,.45); }
  dialog.dlg p { margin: 0 0 12px; line-height: 1.4; }
  dialog.dlg input { width: 100%; padding: 8px; font-size: 14px; margin: 4px 0 6px; box-sizing: border-box; }
  .dlg-b { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
  .dlg-b button { padding: 8px 14px; cursor: pointer; }
  .dlg-ok { background: var(--azul); color: #fff; border: 0; border-radius: 4px; }
  .dlg-err { color: #b42318; font-size: 12px; min-height: 16px; margin: 0; }
  #avisos { position: fixed; right: 16px; bottom: 16px; z-index: 20; display: flex; flex-direction: column; gap: 8px; max-width: 380px; }
  .aviso { background: #1f2937; color: #fff; padding: 10px 14px; border-radius: 6px; box-shadow: 0 4px 14px rgba(0,0,0,.25); font-size: 13px; }
  .aviso.error { background: #b42318; }
  .banner-copia { background: #fff7e6; border: 1px solid #f5c26b; border-radius: 6px; padding: 10px 14px; margin-bottom: 14px; font-size: 13px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .banner-copia button { padding: 6px 12px; cursor: pointer; }
  /* Tablas anchas: desplazamiento horizontal dentro de la tabla (solo en pantalla) */
  @media screen { table { display: block; max-width: 100%; overflow-x: auto; } }
  /* Pantallas pequeñas: menú arriba y contenido a ancho completo */
  @media screen and (max-width: 800px) {
    body { flex-direction: column; }
    header .autor-cab, header .version { display: none; }
    #lateral { position: static; width: auto; margin-top: 48px; border-right: 0; border-bottom: 1px solid var(--borde); max-height: 45vh; }
    main { margin: 0; padding: 16px; width: 100%; box-sizing: border-box; }
    .rejilla { grid-template-columns: 1fr; }
    .card { padding: 12px; }
  }
</style>

<script>
// ===== Motor contable PGC PYMES (versión 2, sin interfaz) =====
// Coeficientes lineales máximos y periodos máximos (art. 12 Ley 27/2014 del Impuesto sobre Sociedades)
// [grupo, tipo de elemento, coeficiente lineal máximo %, periodo máximo en años]
const TABLA_AM = [
  ["Obra civil", "Obra civil general", 2, 100], ["Obra civil", "Pavimentos", 6, 34], ["Obra civil", "Infraestructuras y obras mineras", 7, 30],
  ["Centrales", "Centrales hidráulicas", 2, 100], ["Centrales", "Centrales nucleares", 3, 60], ["Centrales", "Centrales de carbón", 4, 50], ["Centrales", "Centrales renovables", 7, 30], ["Centrales", "Otras centrales", 5, 40],
  ["Edificios", "Edificios industriales", 3, 68], ["Edificios", "Terrenos dedicados exclusivamente a escombreras", 4, 50], ["Edificios", "Almacenes y depósitos (gaseosos, líquidos y sólidos)", 7, 30], ["Edificios", "Edificios comerciales, administrativos, de servicios y viviendas", 2, 100],
  ["Instalaciones", "Subestaciones. Redes de transporte y distribución de energía", 5, 40], ["Instalaciones", "Cables", 7, 30], ["Instalaciones", "Resto instalaciones", 10, 20], ["Instalaciones", "Maquinaria", 12, 18], ["Instalaciones", "Equipos médicos y asimilados", 15, 14],
  ["Elementos de transporte", "Locomotoras, vagones y equipos de tracción", 8, 25], ["Elementos de transporte", "Buques, aeronaves", 10, 20], ["Elementos de transporte", "Elementos de transporte interno", 10, 20], ["Elementos de transporte", "Elementos de transporte externo", 16, 14], ["Elementos de transporte", "Autocamiones", 20, 10],
  ["Mobiliario y enseres", "Mobiliario", 10, 20], ["Mobiliario y enseres", "Lencería", 25, 8], ["Mobiliario y enseres", "Cristalería", 50, 4], ["Mobiliario y enseres", "Útiles y herramientas", 25, 8], ["Mobiliario y enseres", "Moldes, matrices y modelos", 33, 6], ["Mobiliario y enseres", "Otros enseres", 15, 14],
  ["Equipos electrónicos e informáticos", "Equipos electrónicos", 20, 10], ["Equipos electrónicos e informáticos", "Equipos para procesos de información", 25, 8], ["Equipos electrónicos e informáticos", "Sistemas y programas informáticos", 33, 6], ["Equipos electrónicos e informáticos", "Producciones cinematográficas, fonográficas, videos y series audiovisuales", 33, 6], ["Equipos electrónicos e informáticos", "Otros elementos", 10, 20]
];
// Grupos a los que no se aplica el método degresivo (el reglamento lo excluye)
const GRUPOS_SIN_DEGRESIVO = ["Edificios", "Mobiliario y enseres"];
const METODOS_AM = [
  ["lineal", "Lineal (vida útil, proporcional a los días en uso)"],
  ["tabla", "Lineal según la tabla de la Ley del Impuesto sobre Sociedades"],
  ["degresivo", "Porcentaje constante (degresivo)"],
  ["digitos_cr", "Dígitos crecientes"],
  ["digitos_dec", "Dígitos decrecientes"],
  ["uso", "Por unidades de uso (unidades, horas, km u otro factor técnico)"]
];
const Motor = (function () {
  const r2 = (x) => { const v = Number(x) || 0; return Math.sign(v) * Math.round(Math.abs(v) * 100 + 1e-7) / 100; };
  const esFecha = (f) => /^\d{4}-\d{2}-\d{2}$/.test(f || "");
  const dias = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 86400000);
  const p3 = (c) => Number(String(c).slice(0, 3));
  const CON_IVA = ["COMPRA", "VENTA", "GASTO", "INVERSION", "VENTA_RET", "DEVOLUCION_VENTA", "DEVOLUCION_COMPRA"];
  const CON_RET = ["COMPRA", "GASTO", "NOMINA", "VENTA_RET"];

  function crearEstado(cfg, plan) {
    return { config: Object.assign({}, cfg), plan: plan.slice(), ops: [], manuales: [], inmov: [], periodos: {}, historial: [], presupuesto: {}, nextId: 1, nextMan: 1 };
  }
  function planMap(plan) { const m = {}; plan.forEach((p) => { m[p.codigo] = p; }); return m; }

  // Añade una línea respetando el signo: un importe negativo se pasa al otro lado
  function push(arr, cuenta, debe, haber) {
    if (!cuenta) return;
    let d = r2(debe), h = r2(haber);
    if (d < 0) { h = r2(h - d); d = 0; }
    if (h < 0) { d = r2(d - h); h = 0; }
    if (d || h) arr.push({ cuenta: Number(cuenta), debe: d, haber: h });
  }
  // Tipo de recargo de equivalencia según el tipo de IVA de la operación
  function reRate(cfg, iva) {
    const x = Number(iva);
    if (x === Number(cfg.iva_gen)) return Number(cfg.re_gen) || 0;
    if (x === Number(cfg.iva_red)) return Number(cfg.re_red) || 0;
    if (x === Number(cfg.iva_sred)) return Number(cfg.re_sred) || 0;
    return 0;
  }
  function cuentaPago(op, cfg) {
    const f = op.forma || "";
    const venta = ["VENTA", "VENTA_RET", "DEVOLUCION_VENTA", "COBRO_CLIENTE"].includes(op.tipo);
    if (f === "Banco") return cfg.bancos;
    if (f === "Caja") return cfg.caja;
    if (venta) return op.terceroCuenta || cfg.clientes;
    if (f === "Proveedor") return op.terceroCuenta || cfg.proveedores;
    if (f === "Acreedor") return op.terceroCuenta || cfg.acreedor;
    return op.terceroCuenta || (op.tipo === "GASTO" ? cfg.acreedor : cfg.proveedores);
  }
  const bancoCaja = (op, cfg) => (op.forma === "Caja" ? cfg.caja : cfg.bancos);
  const cta = (x) => (x ? Number(x) : null);

  // Líneas de una operación (sin fecha ni número). plan = mapa de cuentas.
  function lineasOperacion(op, cfg, plan) {
    const E = Number(op.base) || 0;
    const L = CON_IVA.includes(op.tipo) ? r2(E * (Number(op.iva) || 0)) : 0;
    const M = CON_RET.includes(op.tipo) ? r2(E * (Number(op.ret) || 0)) : 0;
    const N = ["COMPRA", "GASTO", "VENTA_RET"].includes(op.tipo) ? r2(E + L - M)
      : ["VENTA", "INVERSION", "DEVOLUCION_VENTA", "DEVOLUCION_COMPRA"].includes(op.tipo) ? r2(E + L) : r2(E);
    const X = r2(E * (Number(op.pct) || 0));
    const RE = (op.tipo === "COMPRA" || op.tipo === "DEVOLUCION_COMPRA") && cfg.re ? r2(E * reRate(cfg, op.iva)) : 0;
    const out = [];
    const add = (c, d, h) => push(out, c, d, h);
    const P = cta(op.cuentaPrin), P2 = cta(op.cuenta2);
    switch (op.tipo) {
      case "COMPRA":
        if (cfg.re) { add(P || cfg.compras, r2(E + L + RE), 0); add(cuentaPago(op, cfg), 0, r2(N + RE)); add(cfg.ret, 0, M); break; }
        add(P || cfg.compras, E, 0); add(cfg.iva_sop, L, 0); add(cuentaPago(op, cfg), 0, N); add(cfg.ret, 0, M); break;
      case "GASTO": add(P || cfg.gasto_def, E, 0); add(cfg.iva_sop, L, 0); add(cuentaPago(op, cfg), 0, N); add(cfg.ret, 0, M); break;
      case "INVERSION": add(P, E, 0); add(cfg.iva_sop, L, 0); add(cuentaPago(op, cfg), 0, N); break;
      case "VENTA":
        if (cfg.re) { add(cuentaPago(op, cfg), N, 0); add(P || cfg.ventas, 0, r2(E + L)); break; }
        add(cuentaPago(op, cfg), N, 0); add(P || cfg.ventas, 0, E); add(cfg.iva_rep, 0, L); break;
      case "VENTA_RET": add(cuentaPago(op, cfg), N, 0); add(cfg.ret_cli, M, 0); add(P || cfg.ventas, 0, E); add(cfg.iva_rep, 0, L); break;
      case "DEVOLUCION_VENTA":
        if (cfg.re) { add(P || cfg.ventas, r2(E + L), 0); add(cuentaPago(op, cfg), 0, N); break; }
        add(P || cfg.ventas, E, 0); add(cfg.iva_rep, L, 0); add(cuentaPago(op, cfg), 0, N); break;
      case "DEVOLUCION_COMPRA":
        if (cfg.re) { add(cuentaPago(op, cfg), r2(N + RE), 0); add(P || cfg.compras, 0, r2(E + L + RE)); break; }
        add(cuentaPago(op, cfg), N, 0); add(P || cfg.compras, 0, E); add(cfg.iva_sop, 0, L); break;
      case "NOMINA": {
        const ssT = r2(E * cfg.ss_trab), ssE = r2(E * cfg.ss_emp);
        add(cfg.sueldos, E, 0); add(cfg.ss_gasto, ssE, 0); add(cfg.ss_acr, 0, r2(ssT + ssE)); add(cfg.ret, 0, M); add(cfg.remun, 0, r2(E - M - ssT)); break; }
      case "COBRO": add(bancoCaja(op, cfg), E, 0); add(P || op.terceroCuenta || cfg.clientes, 0, E); break;
      case "PAGO": add(P || op.terceroCuenta || cfg.proveedores, E, 0); add(bancoCaja(op, cfg), 0, E); break;
      case "PAGO_HACIENDA": add(P || cfg.hp_acr, E, 0); add(bancoCaja(op, cfg), 0, E); break;
      case "PRESTAMO": add(bancoCaja(op, cfg), E, 0); add(P || cfg.deuda, 0, E); break;
      case "CUOTA_PRESTAMO": add(P || cfg.deuda, r2(E - X), 0); add(cfg.intereses, X, 0); add(bancoCaja(op, cfg), 0, E); break;
      case "APORTACION": add(bancoCaja(op, cfg), E, 0); add(P || cfg.capital, 0, E); break;
      case "SUBVENCION": add(bancoCaja(op, cfg), E, 0); add(P || cfg.subv, 0, E); break;
      case "ANTICIPO_CLIENTE": add(bancoCaja(op, cfg), E, 0); add(P || cfg.anticipo_cli, 0, E); break;
      case "ANTICIPO_PROVEEDOR": add(P || cfg.anticipo_pro, E, 0); add(bancoCaja(op, cfg), 0, E); break;
      case "EFECTO_CLIENTE": add(cfg.efe_cob, E, 0); add(P || cfg.clientes, 0, E); break;
      case "EFECTO_DESCUENTO": add(bancoCaja(op, cfg), r2(E - X), 0); add(cfg.gastos_efe, X, 0); add(P || cfg.efe_cob, 0, E); break;
      case "EFECTO_PAGAR": add(P || cfg.proveedores, E, 0); add(P === cfg.acreedor ? cfg.efe_pag_acr : cfg.efe_pag, 0, E); break;
      case "AMORTIZACION": add(cfg.amort, E, 0); add(P, 0, E); break;
      case "AMORT_LINEAL": add(P2 || cfg.amort, X, 0); add(P, 0, X); break;
      case "IS_CUOTA": add(cfg.is_gasto, X, 0); add(cfg.is_pagar, 0, X); break;
      case "PERIODIF_GASTO": add(cfg.periodif_gasto, X, 0); add(P || cfg.gasto_def, 0, X); break;
      case "PERIODIF_INGRESO": add(P || cfg.ventas, X, 0); add(cfg.periodif_ing, 0, X); break;
      case "DEVENGO_GASTO": add(P || cfg.gasto_def, E, 0); add(cfg.acreedor, 0, E); break;
      case "DEVENGO_INGRESO": add(cfg.clientes, E, 0); add(P || cfg.ventas, 0, E); break;
      case "DETERIORO": add(cfg.det_gasto, E, 0); add(cfg.det_corr, 0, E); break;
      case "REVERSION_DETERIORO": add(cfg.det_corr, E, 0); add(cfg.rev_det, 0, E); break;
      case "DIVIDENDOS": add(P || cfg.remanente, E, 0); add(cfg.div_pagar, 0, E); break;
      case "EXISTENCIAS": {
        // E = valor del inventario final; el inicial es el saldo de apertura de la cuenta
        const ap = plan[P] ? Number(plan[P].saldo) || 0 : 0;
        const v = P === 300 ? cfg.var300 : P === 310 ? cfg.var310 : cfg.var_otros;
        add(v, ap, 0); add(P, 0, ap); add(P, E, 0); add(v, 0, E); break; }
      case "MANUAL": add(P, E, 0); add(P2, 0, E); break;
      default: break;
    }
    return out;
  }

  function lineasApertura(estado) {
    const out = [];
    estado.plan.forEach((p) => { const s = Number(p.saldo) || 0; if (s) push(out, p.codigo, s, 0); });
    return out;
  }

  // Dotación de un elemento del inmovilizado en el ejercicio (línea recta, por días)
  function dotacion(el, cfg) {
    const met = el.metodo || "lineal";
    const tab = met === "tabla" || met === "degresivo" ? TABLA_AM.find((t) => t[1] === el.tipoTabla) : null;
    const grupo = tab ? tab[0] : el.grupo;
    const vida = tab ? tab[3] : Number(el.vida);
    const base = Number(el.coste) - Number(el.residual || 0);
    if (!(base > 0) || !esFecha(el.fecha) || el.fecha > cfg.fin) return 0;
    const diasAno = dias(cfg.inicio, cfg.fin) + 1;
    const desde = el.fecha > cfg.inicio ? el.fecha : cfg.inicio;
    const dd = Math.max(0, dias(desde, cfg.fin) + 1);
    const f = dd / diasAno;                       // proporción del ejercicio en uso
    const resto = Math.max(0, base - (Number(el.amAnterior) || 0));
    const nAnt = Number(el.nAm) || 0;             // ejercicios ya amortizados
    const primero = nAnt === 0;
    let anual = 0;
    if (met === "uso") {
      const U = Number(el.unidadesTotales), u = Number(el.unidadesAnio) || 0;
      if (!(U > 0) || !(u > 0)) return 0;
      return r2(Math.min(base * u / U, resto));
    }
    if (met === "digitos_cr" || met === "digitos_dec") {
      const n = Math.round(vida), k = nAnt + 1;
      if (!(n > 0) || k > n) return 0;
      const S = n * (n + 1) / 2, w = met === "digitos_cr" ? k / S : (n - k + 1) / S;
      anual = base * w * (primero ? f : 1);
    } else if (met === "degresivo" && !GRUPOS_SIN_DEGRESIVO.includes(grupo)) {
      if (!(vida > 0)) return 0;
      const lin = tab ? tab[2] / 100 : 1 / vida;
      const k = vida < 5 ? 1.5 : vida < 8 ? 2 : 2.5;      // coeficiente degresivo según el periodo
      const pct = Math.max(lin * k, 0.11);                 // nunca inferior al 11 %
      const nRest = vida - nAnt;
      const deg = resto * pct, linRest = nRest > 0 ? resto / nRest : resto;
      anual = Math.max(deg, linRest) * (primero ? f : 1);  // se pasa a lineal cuando conviene
    } else if (met === "tabla" && tab) {
      anual = base * (tab[2] / 100) * f;
    } else {                                               // lineal (también degresivo en grupos excluidos)
      if (!(vida > 0)) return 0;
      anual = base / vida * f;
    }
    return r2(Math.min(anual, resto));
  }
  function lineasInmovilizado(estado) {
    const cfg = estado.config, porCta = {};
    let total = 0;
    estado.inmov.forEach((el) => {
      const d = dotacion(el, cfg);
      if (!d) return;
      total = r2(total + d);
      porCta[el.ctaAm] = r2((porCta[el.ctaAm] || 0) + d);
    });
    if (!total) return [];
    const out = [];
    push(out, cfg.amort, total, 0);
    Object.keys(porCta).forEach((c) => push(out, c, 0, porCta[c]));
    return out;
  }

  function periodoDeFecha(fecha) { return Math.floor((Number(fecha.slice(5, 7)) - 1) / 3) + 1; }
  function estadoPeriodo(estado, q) { return (estado.periodos[q] && estado.periodos[q].estado) || "Abierto"; }
  function estadoPeriodoIrpf(estado, q) { return (estado.periodosIrpf && estado.periodosIrpf[q] && estado.periodosIrpf[q].estado) || "Abierto"; }
  // Una operación con retención de IRPF también depende del periodo del IRPF (modelos 111 y 130)
  function tieneIrpf(op) { return op.tipo === "NOMINA" || (CON_RET.includes(op.tipo) && Number(op.ret) > 0); }
  function puedeModificar(estado, op) {
    const q = periodoDeFecha(op.fecha);
    if (estadoPeriodo(estado, q) !== "Abierto") return false;
    if (tieneIrpf(op) && estadoPeriodoIrpf(estado, q) !== "Abierto") return false;
    return true;
  }

  // Operaciones y manuales ordenados por fecha, con su número de asiento
  function asientos(estado) {
    const cfg = estado.config, pm = planMap(estado.plan), list = [];
    estado.ops.slice().sort((a, b) => (a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : a.id - b.id)).forEach((op) => {
      if (!esFecha(op.fecha)) return;
      const ls = lineasOperacion(op, cfg, pm);
      if (ls.length) list.push({ num: "O" + op.id, fecha: op.fecha, tipo: op.tipo, concepto: op.concepto || op.tipo, origen: "op", lineas: ls });
    });
    estado.manuales.forEach((m) => {
      if (esFecha(m.fecha)) list.push({ num: "M" + m.num, fecha: m.fecha, tipo: "MANUAL", concepto: m.concepto || "Asiento manual", origen: "man", lineas: m.lineas });
    });
    return list;
  }

  function trimestre(q, y) {
    const ini = `${y}-${String(3 * (q - 1) + 1).padStart(2, "0")}-01`;
    const m = 3 * q, ult = new Date(y, m, 0).getDate();
    return { ini, fin: `${y}-${String(m).padStart(2, "0")}-${String(ult).padStart(2, "0")}` };
  }
  function sumaCta(asientosList, c, ini, fin, signo) {
    let s = 0;
    asientosList.forEach((a) => { if (a.fecha < ini || a.fecha > fin) return; a.lineas.forEach((l) => { if (l.cuenta === c) s += signo * (l.debe - l.haber); }); });
    return r2(s);
  }

  // Liquidaciones de IVA (472/477) y de IRPF (111: 4751; 130: 473) por trimestre
  function liquidaciones(estado, base) {
    const cfg = estado.config, y = Number(cfg.inicio.slice(0, 4)), out = [];
    let pagos130 = 0;
    for (let q = 1; q <= 4; q++) {
      const t = trimestre(q, y);
      const ls = [];
      const rep = r2(-sumaCta(base, cfg.iva_rep, t.ini, t.fin, 1)), sop = r2(sumaCta(base, cfg.iva_sop, t.ini, t.fin, 1));
      if (rep || sop) {
        if (rep) push(ls, cfg.iva_rep, rep, 0);
        if (sop) push(ls, cfg.iva_sop, 0, sop);
        const net = r2(rep - sop);
        if (net > 0) push(ls, cfg.hp_acr, 0, net);
        if (net < 0) push(ls, cfg.hp_deu, -net, 0);
        out.push({ num: "IVA" + q, fecha: t.fin, tipo: "LIQ_IVA", concepto: `Liquidación IVA ${q}T`, origen: "liq", lineas: ls.slice() });
      }
      // IRPF modelo 111: retenciones practicadas del trimestre (4751)
      const ret111 = r2(-sumaCta(base, cfg.ret, t.ini, t.fin, 1));
      if (ret111 > 0) {
        const l2 = []; push(l2, cfg.ret, ret111, 0); push(l2, cfg.hp_acr, 0, ret111);
        out.push({ num: "I111-" + q, fecha: t.fin, tipo: "LIQ_IRPF111", concepto: `Liquidación retenciones IRPF ${q}T (111)`, origen: "liq", lineas: l2 });
      }
      // IRPF modelo 130 (empresarios individuales): pago fraccionado acumulado
      if (cfg.es_autonomo) {
        const ini = `${y}-01-01`;
        let ing = 0, gas = 0;
        base.forEach((a) => { if (a.fecha < ini || a.fecha > t.fin) return; a.lineas.forEach((l) => {
          const g = p3(l.cuenta);
          if (g >= 700 && g < 800) ing += l.haber - l.debe;
          if (g >= 600 && g < 700 && ![630, 633, 639].includes(g)) gas += l.debe - l.haber; }); });
        const rend = r2(ing - gas);
        const retSop = sumaCta(base, cfg.ret_cli, ini, t.fin, 1);
        const acum = r2(Math.max(0, (cfg.irpf_fracc || 0.2) * Math.max(rend, 0) - retSop));
        const pago = r2(Math.max(0, acum - pagos130));
        pagos130 = r2(pagos130 + pago);
        if (pago > 0) {
          const l3 = []; push(l3, cfg.ret_cli, pago, 0); push(l3, cfg.hp_acr, 0, pago);
          out.push({ num: "I130-" + q, fecha: t.fin, tipo: "PAGO_FRACC_130", concepto: `Pago fraccionado IRPF ${q}T (130)`, origen: "liq", lineas: l3 });
        }
      }
    }
    return out;
  }

  // Libro diario completo: apertura, operaciones, inmovilizado, liquidaciones y regularización
  function libroDiario(estado) {
    const cfg = estado.config;
    const base = asientos(estado);
    const inm = lineasInmovilizado(estado);
    const todos = [{ num: "AP", fecha: cfg.fechaApertura || cfg.inicio, tipo: "APERTURA", concepto: "Asiento de apertura", origen: "ap", lineas: lineasApertura(estado) }]
      .concat(base);
    if (inm.length) todos.push({ num: "AMORT", fecha: cfg.fin, tipo: "DOTACION", concepto: "Dotación automática de amortización", origen: "inm", lineas: inm });
    const liq = liquidaciones(estado, base.concat(inm.length ? [{ lineas: inm, fecha: cfg.fin }] : []));
    liq.forEach((x) => todos.push(x));
    // Regularización de gastos e ingresos a la cuenta de resultados
    const pm = planMap(estado.plan), pyg = {};
    todos.forEach((a) => { if (a.origen === "ap") return; a.lineas.forEach((l) => {
      const p = pm[l.cuenta];
      if (p && (p.tipo === "Gasto" || p.tipo === "Ingreso")) pyg[l.cuenta] = r2((pyg[l.cuenta] || 0) + l.debe - l.haber); }); });
    const reg = []; let suma = 0;
    Object.keys(pyg).forEach((k) => { const s = pyg[k]; if (!s) return; push(reg, Number(k), -s, 0); suma = r2(suma + s); });
    if (reg.length) { push(reg, cfg.pyg, suma, 0); todos.push({ num: "REG", fecha: cfg.fin, tipo: "REGULARIZACION", concepto: "Regularización de gastos e ingresos", origen: "reg", lineas: reg }); }
    return todos;
  }

  function saldos(estado, sinReg) {
    const s = {};
    libroDiario(estado).forEach((a) => { if (sinReg && a.origen === "reg") return; a.lineas.forEach((l) => { s[l.cuenta] = r2((s[l.cuenta] || 0) + l.debe - l.haber); }); });
    return s;
  }

  function balance(estado) {
    const s = saldos(estado), pm = planMap(estado.plan);
    let activo = 0, pn = 0, pasivo = 0;
    Object.keys(s).forEach((k) => { const p = pm[k]; if (!p) return; const v = s[k];
      if (p.tipo === "Activo") activo += v; else if (p.tipo === "Patrimonio neto") pn -= v; else if (p.tipo === "Pasivo") pasivo -= v; });
    return { activo: r2(activo), patrimonioNeto: r2(pn), pasivo: r2(pasivo), resultado: r2(-(s[estado.config.pyg] || 0)), cuadra: Math.abs(activo - pn - pasivo) < 0.005 };
  }

  // Cuenta de pérdidas y ganancias por partidas (sin regularizar)
  function pyg(estado) {
    const s = saldos(estado, true), pm = planMap(estado.plan), sum = (f) => Object.keys(s).filter((k) => pm[k] && f(Number(k), pm[k])).reduce((a, k) => a + (s[k] || 0), 0);
    const r = (lo, hi) => sum((c) => p3(c) >= lo && p3(c) <= hi);
    const ventas = -r(700, 709);
    const v = {
      ventas, varExist: -r(710, 712), trabajos: -r(730, 731), aprovisionamientos: -r(600, 619),
      otrosIngresos: -r(740, 759), personal: -r(640, 649),
      otrosGastos: -(r(620, 629) + r(631, 631) + r(634, 634) + r(636, 636) + r(650, 659) + r(690, 699) + r(794, 794)),
      amortizacion: -r(680, 689),
      ingFin: -r(760, 769), gasFin: -r(660, 669), difCambio: -r(668, 668),
      impuesto: -(r(630, 630) + r(633, 633) + r(639, 639)),
    };
    v.resExplotacion = r2(v.ventas + v.varExist + v.trabajos + v.aprovisionamientos + v.otrosIngresos + v.personal + v.otrosGastos + v.amortizacion);
    return v;
  }

  // Estado de flujos de efectivo (método indirecto)
  function flujos(estado) {
    const cfg = estado.config, pm = planMap(estado.plan), s = saldos(estado), ap = {};
    estado.plan.forEach((p) => { ap[p.codigo] = Number(p.saldo) || 0; });
    const grupo = (f) => { let v = 0; Object.keys(s).forEach((k) => { const p = pm[k]; if (p && f(Number(k), p)) v += (s[k] || 0) - (ap[k] || 0); }); return r2(v); };
    const dNC = grupo((c, p) => p.tipo === "Activo" && p.plazo === "No corriente");
    const dOps = grupo((c, p) => p.tipo === "Activo" && p.plazo === "Corriente" && p3(c) >= 300 && p3(c) < 540);
    const dInvF = grupo((c, p) => p.tipo === "Activo" && p.plazo === "Corriente" && p3(c) >= 540 && p3(c) < 570);
    const dCaja = grupo((c, p) => p.tipo === "Activo" && p.plazo === "Corriente" && p3(c) >= 570 && p3(c) < 580);
    const dPN = -grupo((c, p) => p.tipo === "Patrimonio neto");
    const dPNC = -grupo((c, p) => p.tipo === "Pasivo" && p.plazo === "No corriente");
    const dPCC = -grupo((c, p) => p.tipo === "Pasivo" && p.plazo === "Corriente" && p3(c) >= 400 && p3(c) < 490);
    const dPCF = -grupo((c, p) => p.tipo === "Pasivo" && p.plazo === "Corriente" && p3(c) >= 520 && p3(c) < 530);
    const res = balance(estado).resultado;
    const amort = Object.keys(saldos(estado, true)).filter((k) => p3(k) >= 680 && p3(k) < 690).reduce((a, k) => a + saldos(estado, true)[k], 0);
    const dPNex = r2(dPN - res);
    const expl = r2(res + amort - dOps + dPCC), inv = r2(-(dNC + amort) - dInvF), fin = r2(dPNex + dPNC + dPCF);
    const caja0 = r2(ap[cfg.caja] + ap[cfg.bancos] || 0), caja1 = r2(s[cfg.caja] || 0) + r2(s[cfg.bancos] || 0);
    return { resultado: res, amortizacion: r2(amort), variacionCircuante: r2(-dOps + dPCC), explotacion: expl,
      inversion: inv, financiacion: fin, variacionNeta: r2(expl + inv + fin), cajaInicial: caja0, cajaFinal: caja1,
      diferencia: r2(caja0 + expl + inv + fin - caja1) };
  }

  // Ratios e indicadores (mismas fórmulas que la hoja Cuentas_Anuales)
  function indicadores(estado) {
    const s = saldos(estado), pm = planMap(estado.plan), b = balance(estado), py = pyg(estado), cfg = estado.config;
    const sum = (f) => Object.keys(s).filter((k) => pm[k] && f(Number(k), pm[k])).reduce((a, k) => a + (s[k] || 0), 0);
    const actC2 = sum((c, p) => p.tipo === "Activo" && p.plazo === "Corriente");
    const pasC = -sum((c, p) => p.tipo === "Pasivo" && p.plazo === "Corriente");
    const exist = sum((c, p) => p.tipo === "Activo" && p3(c) >= 300 && p3(c) < 400);
    const caja = sum((c, p) => p.tipo === "Activo" && p3(c) >= 570 && p3(c) < 580);
    const pasT = b.pasivo, pn = b.patrimonioNeto, at = b.activo;
    const pmc = py.ventas ? sum((c, p) => p.tipo === "Activo" && p3(c) >= 430 && p3(c) < 440) / py.ventas * 365 : null;
    const sr = saldos(estado, true);
    const compras = Object.keys(sr).filter((k) => pm[k] && p3(k) >= 600 && p3(k) < 640 && ![630, 633, 639].includes(p3(k)) && pm[k].tipo === "Gasto").reduce((a, k) => a + (sr[k] || 0), 0);
    const pmp = compras ? -sum((c, p) => p.tipo === "Pasivo" && p3(c) >= 400 && p3(c) < 420) / compras * 365 : null;
    const ing = py.ventas;
    const I = {
      liquidez: pasC ? actC2 / pasC : null,
      pruebaAcida: pasC ? (actC2 - exist) / pasC : null,
      disponibilidad: pasC ? caja / pasC : null,
      fondoManiobra: actC2 - pasC,
      endeudamiento: at ? (pasT) / (b.patrimonioNeto + pasT) : null,
      autonomia: (b.patrimonioNeto + pasT) ? pn / (pn + pasT) : null,
      solvencia: pasT ? at / pasT : null,
      roe: pn ? b.resultado / pn : null,
      roa: at ? b.resultado / at : null,
      margen: ing ? b.resultado / ing : null,
      pmc, pmp, rotacion: at ? ing / at : null,
      cobertura: py.gasFin ? py.resExplotacion / (-py.gasFin) : null,
    };
    return I;
  }

  // Semáforo de un indicador (mayor o menor es mejor)
  function semaforo(valor, mayorMejor, verde, amarillo) {
    if (valor == null || isNaN(valor)) return "Sin datos";
    if (mayorMejor) return valor >= verde ? "VERDE" : valor >= amarillo ? "AMARILLO" : "ROJO";
    return valor <= verde ? "VERDE" : valor <= amarillo ? "AMARILLO" : "ROJO";
  }

  // Anulación: nueva operación con el importe cambiado de signo, en un periodo abierto
  function anularOperacion(estado, id, fechaAnul, motivo) {
    const op = estado.ops.find((o) => o.id === id);
    if (!op) throw new Error("No existe la operación " + id);
    if (op.tipo === "EXISTENCIAS") throw new Error("Las regularizaciones de existencias se corrigen registrando de nuevo el inventario final.");
    if (!esFecha(fechaAnul)) throw new Error("Fecha de anulación no válida.");
    if (estadoPeriodo(estado, periodoDeFecha(fechaAnul)) !== "Abierto") throw new Error("La anulación debe fecharse en un periodo abierto.");
    if (tieneIrpf(op) && estadoPeriodoIrpf(estado, periodoDeFecha(fechaAnul)) !== "Abierto") throw new Error("La anulación de una operación con retención debe fecharse en un periodo de IRPF abierto.");
    const nueva = Object.assign({}, op, { id: estado.nextId++, fecha: fechaAnul, base: -Number(op.base), concepto: "ANULACIÓN op. " + id + ": " + (op.concepto || op.tipo), anulaDe: id });
    estado.ops.push(nueva);
    estado.historial.push({ fecha: fechaAnul, anulada: id, tipo: op.tipo, concepto: op.concepto || "", importe: Number(op.base), motivo: motivo, nueva: nueva.id });
    return nueva;
  }

  // Comprobaciones del libro (equivale a ComprobarLibro de la hoja de cálculo)
  function comprobar(estado) {
    const av = [];
    const ap = lineasApertura(estado);
    const dAp = r2(ap.reduce((a, l) => a + l.debe, 0)), hAp = r2(ap.reduce((a, l) => a + l.haber, 0));
    if (dAp !== hAp) av.push(`La apertura no cuadra: diferencia de ${(dAp - hAp).toFixed(2)} €`);
    libroDiario(estado).forEach((a) => {
      const d = r2(a.lineas.reduce((x, l) => x + l.debe, 0)), h = r2(a.lineas.reduce((x, l) => x + l.haber, 0));
      if (d !== h) av.push(`Asiento ${a.num} (${a.concepto}) descuadrado`);
    });
    if (!balance(estado).cuadra) av.push("El balance no cuadra");
    if (flujos(estado).diferencia !== 0) av.push("El estado de flujos no cuadra con la variación de caja");
    estado.ops.forEach((o) => { if (!esFecha(o.fecha)) av.push(`Operación ${o.id} sin fecha válida`); });
    return av;
  }

  // Conciliación bancaria: compara los apuntes de bancos con el extracto (fecha e importe)
  function conciliar(estado, extracto, tolDias) {
    const cuenta = estado.config.bancos, tol = tolDias == null ? 5 : tolDias;
    const libro = [];
    libroDiario(estado).forEach((a) => { if (a.origen === "ap") return; a.lineas.forEach((l) => { if (l.cuenta === cuenta) libro.push({ fecha: a.fecha, concepto: a.concepto, importe: r2(l.debe - l.haber) }); }); });
    const cerca = (f1, f2) => Math.abs(dias(f1, f2)) <= tol;
    libro.forEach((x) => { x.estado = extracto.some((e) => e.importe === x.importe && cerca(x.fecha, e.fecha)) ? "Conciliado" : "Pendiente en el banco"; });
    const ext = extracto.map((e) => Object.assign({}, e, { estado: libro.some((x) => x.importe === e.importe && cerca(x.fecha, e.fecha)) ? "Conciliado" : "Solo en el banco" }));
    return { libro, extracto: ext, pendientesBanco: libro.filter((x) => x.estado !== "Conciliado").length, soloBanco: ext.filter((x) => x.estado !== "Conciliado").length };
  }

  // Resumen trimestral del modelo 303 (bases y cuotas por tipo de IVA)
  function modelo303(estado) {
    const cfg = estado.config, y = Number(cfg.inicio.slice(0, 4)), tipos = [cfg.iva_gen || 0.21, cfg.iva_red || 0.10, cfg.iva_sred || 0.04];
    const ventas = ["VENTA", "VENTA_RET", "DEVOLUCION_VENTA"], compras = ["COMPRA", "GASTO", "INVERSION", "DEVOLUCION_COMPRA"];
    const res = [];
    for (let q = 1; q <= 4; q++) {

const MEMORIA_SECCIONES = [
  { key: "act", titulo: "1. Actividad de la empresa",
    base: "{empresa}, con CIF {cif}, tiene por objeto social [describir la actividad principal]. Su domicilio social está en [dirección]. La empresa se constituyó por tiempo indefinido. El ejercicio económico comienza el {inicio} y termina el {fin}." },
  { key: "bas", titulo: "2. Bases de presentación de las cuentas anuales",
    base: "Las cuentas anuales se han formulado a partir de los registros contables, de conformidad con el Plan General de Contabilidad de PYMES (Real Decreto 1515/2007, modificado por el Real Decreto 602/2016) y aplicando el principio de imagen fiel. No se han aplicado principios contables no obligatorios ni se han dejado de aplicar disposiciones legales por razones excepcionales. Las cifras se expresan en euros. [Indicar si es el primer ejercicio o la comparación con el ejercicio anterior.]" },
  { key: "nrv", titulo: "3. Normas de registro y valoración",
    base: "Inmovilizado intangible: se valora a coste de adquisición y se amortiza de forma lineal durante su vida útil. Inmovilizado material: coste de adquisición con amortización lineal según la vida útil estimada. Activos y pasivos financieros: se valoran a coste amortizado; los clientes, por su valor nominal menos el deterioro estimado. Existencias: precio de adquisición o coste de producción, con deterioro si su valor realizable es inferior. Impuesto sobre beneficios: se registra el gasto del ejercicio según el resultado contable. Ingresos: se reconocen cuando se transfieren los riesgos y beneficios o se presta el servicio. Provisiones: se dotan cuando existe una obligación probable de pago." },

  { key: "afi", titulo: "5. Activos financieros",

  function abrirDialogo(html, enlazar) {
    return new Promise((resolve) => {
      const d = document.createElement("dialog"); d.className = "dlg"; d.innerHTML = html;
      document.body.appendChild(d);
      let hecho = false;
      const cerrar = (v) => { if (hecho) return; hecho = true; d.close(); d.remove(); resolve(v); };
      d.addEventListener("cancel", (ev) => { ev.preventDefault(); cerrar(null); });
      enlazar(d, cerrar);
      d.showModal();
      const primero = d.querySelector("input, [data-ok]"); if (primero) primero.focus();
    });
  }

      (d, cerrar) => {
        d.querySelector("[data-ok]").onclick = () => cerrar(true);

  // Importe de extracto: "1.505,70" (formato español) o "1505.70" (decimal con punto)
  function importeExtracto(x) {
    let t = String(x == null ? "0" : x).trim().replace(/\s/g, "");
    if (t.indexOf(",") >= 0) t = t.replace(/\./g, "").replace(",", ".");
    return Number(t) || 0;
  }
  function parsearExtracto(texto) {
    return texto.split(/\r?\n/).map((l) => l.trim()).filter(Boolean).map((l) => {
      const [f, c, imp] = l.split(";");
      let fecha = (f || "").trim();
      const m = fecha.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
      if (m) fecha = `${m[3]}-${m[2]}-${m[1]}`;
      return { fecha, concepto: (c || "").trim(), importe: Motor.r2(importeExtracto(imp)) };
    }).filter((x) => /^\d{4}-\d{2}-\d{2}$/.test(x.fecha));
  }

  function grupos() {

    Object.keys(s).forEach((k) => { const p = pm[k]; if (!p) return; const v = s[k];
      if (p.tipo === "Activo") (p.plazo === "No corriente" ? (g.anc += v) : (g.ac += v));
      else if (p.tipo === "Patrimonio neto") g.pn -= v;
      else if (p.tipo === "Pasivo") (p.plazo === "No corriente" ? (g.pnc -= v) : (g.pc -= v)); });
    return g;
  }
  function graficoBalance(g) {
    const act = g.anc + g.ac, pas = g.pn + g.pnc + g.pc;
    const H = 330, top = 24, base = top + 270, escala = 270 / Math.max(1, Math.abs(act), Math.abs(pas));
    const colores = { ANC: "#2f5597", AC: "#8faadc", PN: "#548235", PNC: "#a9d18e", PC: "#c55a11" };
    const bloque = (x, partes, total, titulo) => {
      let y = top, out = "";
      partes.forEach(([sig, v]) => {
        const h = Math.max(0, Math.abs(v) * escala), pct = total ? (v / total) * 100 : 0;
        out += `<rect x="${x}" y="${y}" width="130" height="${h}" fill="${colores[sig]}" stroke="#fff"/>`;
        if (h > 16) out += `<text x="${x + 65}" y="${y + h / 2 + 4}" text-anchor="middle" font-size="10" fill="${sig === "AC" || sig === "PNC" ? "#111" : "#fff"}">${sig}: ${numES(v)} € · ${pct.toFixed(1).replace(".", ",")} %</text>`;
        y += h;
      });
      return out + `<text x="${x + 65}" y="${base + 18}" text-anchor="middle" font-size="12" font-weight="bold">${titulo}</text>
        <text x="${x + 65}" y="${base + 33}" text-anchor="middle" font-size="10">${numES(total)} €</text>`;
    };
    return `<svg viewBox="0 0 480 ${H + 20}" width="480" style="max-width:100%">
      ${bloque(40, [["ANC", g.anc], ["AC", g.ac]], act, "ACTIVO")}
      ${bloque(300, [["PN", g.pn], ["PNC", g.pnc], ["PC", g.pc]], pas, "PN Y PASIVO")}
      <text x="240" y="${H + 14}" text-anchor="middle" font-size="9" fill="#555">ANC = activo no corriente · AC = activo corriente · PN = patrimonio neto · PNC = pasivo no corriente · PC = pasivo corriente</text>
    </svg>`;
  }

  // Gráficos: tesorería a fin de mes e ingresos/gastos por mes
  function graficoLineas(valores, etiquetas) {
    // Tesorería a fin de mes: barras con eje vertical en euros (sin valores sobre cada barra)
    const W = 560, H = 240, pL = 80, pR = 16, pT = 18, pB = 30, n = valores.length;
    let vmin = Math.min(0, ...valores), vmax = Math.max(0, ...valores);
    if (vmax === vmin) vmax = vmin + 1;
    const y = (v) => pT + (vmax - v) / (vmax - vmin) * (H - pT - pB);
    const ancho = (W - pL - pR) / Math.max(1, n);
    let ejes = "";
    for (let k = 0; k <= 4; k++) {
      const v = vmin + k * (vmax - vmin) / 4, yy = y(v);
      ejes += `<line x1="${pL}" y1="${yy}" x2="${W - pR}" y2="${yy}" stroke="#ddd"/><text x="${pL - 6}" y="${yy + 4}" font-size="10" text-anchor="end">${numES(v)}</text>`;
    }
    const barras = valores.map((v, i) => {
      const x = pL + i * ancho + ancho * 0.15, w = ancho * 0.7, y0 = y(0), yv = y(v);
      return `<rect x="${x}" y="${Math.min(y0, yv)}" width="${w}" height="${Math.max(1, Math.abs(yv - y0))}" fill="${v < 0 ? "#c00000" : "#2f5597"}"/>`;
    }).join("");
    const meses = etiquetas.map((e, i) => `<text x="${pL + i * ancho + ancho / 2}" y="${H - 10}" font-size="10" text-anchor="middle">${e}</text>`).join("");
    return `<svg viewBox="0 0 ${W} ${H}" width="${W}" style="max-width:100%">
      <text x="${pL - 6}" y="12" font-size="10" text-anchor="end">€</text>${ejes}
      <line x1="${pL}" y1="${y(0)}" x2="${W - pR}" y2="${y(0)}" stroke="#666"/>${barras}${meses}</svg>`;
  }
  function graficoBarras(ing, gas, etiquetas) {
    // Ingresos y gastos por mes, con eje vertical en euros
    const W = 560, H = 240, pL = 80, pR = 16, pT = 24, pB = 30, n = etiquetas.length;
    const vmax = Math.max(1, ...ing, ...gas, 0), vmin = Math.min(0, ...ing, ...gas);
    const y = (v) => pT + (vmax - v) / (vmax - vmin) * (H - pT - pB);
    const ancho = (W - pL - pR) / Math.max(1, n);
    let ejes = "";
    for (let k = 0; k <= 4; k++) {
      const v = vmin + k * (vmax - vmin) / 4, yy = y(v);
      ejes += `<line x1="${pL}" y1="${yy}" x2="${W - pR}" y2="${yy}" stroke="#ddd"/><text x="${pL - 6}" y="${yy + 4}" font-size="10" text-anchor="end">${numES(v)}</text>`;
    }

  function graficoBarrasH(items, fmt) {
    const W = 560, filaH = 26, H = items.length * filaH + 10, lab = 230, max = Math.max(1, ...items.map((i) => Math.abs(i.v || 0)));
    const ancho = W - lab - 90;
    return `<svg viewBox="0 0 ${W} ${H}" width="${W}" style="max-width:100%">
      ${items.map((it, i) => { const v = it.v || 0, w = Math.abs(v) / max * ancho, y = i * filaH + 5;
        return `<text x="${lab - 6}" y="${y + 15}" font-size="11" text-anchor="end">${esc(it.etq)}</text>
        <rect x="${lab}" y="${y}" width="${Math.max(w, 1)}" height="${filaH - 10}" fill="${v < 0 ? "#c00000" : "#2f5597"}"/>
        <text x="${lab + w + 4}" y="${y + 15}" font-size="11">${fmt(v)}</text>`; }).join("")}</svg>`;
  }
  function graficoTarta(items) {
    const pos = items.filter((i) => i.v > 0), total = pos.reduce((a, i) => a + i.v, 0) || 1;
    const cols = ["#2f5597", "#c55a11", "#548235", "#7030a0", "#bf9000", "#8faadc"];
    let ang = -Math.PI / 2, paths = "", leyenda = "";
    const cx = 110, cy = 115, r = 100;
    pos.forEach((it, i) => {
      const frac = it.v / total, a = frac * 2 * Math.PI, x1 = cx + r * Math.cos(ang), y1 = cy + r * Math.sin(ang);
      const mid = ang + a / 2;
      ang += a;
      const x2 = cx + r * Math.cos(ang), y2 = cy + r * Math.sin(ang), large = a > Math.PI ? 1 : 0, col = cols[i % cols.length];
      paths += `<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${large} 1 ${x2},${y2} Z" fill="${col}" stroke="#fff"/>`;
      const txt = (frac * 100).toFixed(1).replace(".", ",") + " %";
      if (frac >= 0.06) paths += `<text x="${cx + r * 0.6 * Math.cos(mid)}" y="${cy + r * 0.6 * Math.sin(mid) + 4}" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">${txt}</text>`;
      else paths += `<text x="${cx + r * 1.12 * Math.cos(mid)}" y="${cy + r * 1.12 * Math.sin(mid) + 4}" font-size="11" font-weight="bold" fill="#111" text-anchor="middle">${txt}</text>`;
      leyenda += `<text x="250" y="${40 + i * 24}" font-size="12"><tspan fill="${col}">■</tspan> ${esc(it.etq)}: ${numES(it.v)} € (${txt})</text>`;
    });
    return `<svg viewBox="0 0 560 240" width="560" style="max-width:100%">${paths}${leyenda}</svg>`;
  }

  // Calcula el balance de un ejercicio: saldos finales por cuenta y rangos de cada línea
  function balancePGCValores(saldosS, plan) {
    const pm = Motor.planMap(plan), p3 = (c) => Number(String(c).slice(0, 3)), v = {};
    BALANCE_LINEAS.forEach((l) => {
      if (!l.k || !l.r) return;
      let tot = 0;
      Object.keys(saldosS).forEach((k) => {
        const p = pm[k]; if (!p) return;
        l.r.forEach(([tipo, plazo, lo, hi]) => {
          if (p.tipo === tipo && (plazo == null || p.plazo === plazo) && p3(k) >= lo && p3(k) <= hi) {
            tot += tipo === ACT_ ? saldosS[k] : -saldosS[k];
          }
        });
      });
      v[l.k] = redondeo(tot);
    });
    v.PN = redondeo(["pn1", "pn2", "pn3", "pn4", "pn5", "pn6", "pn7", "pn8", "pn9", "pn10"].reduce((a, k) => a + (v[k] || 0), 0));
    v.PNC = redondeo(["pnc1", "pnc2", "pnc3", "pnc4", "pnc5"].reduce((a, k) => a + (v[k] || 0), 0));
    v.PC = redondeo(["pc1", "pc2", "pc3", "pc4", "pc5"].reduce((a, k) => a + (v[k] || 0), 0));
    v.ANC = redondeo(["anc1", "anc2", "anc3", "anc4", "anc5", "anc6"].reduce((a, k) => a + (v[k] || 0), 0));
    v.AC = redondeo(["ac1", "ac2", "ac3", "ac4", "ac5", "ac6", "ac7"].reduce((a, k) => a + (v[k] || 0), 0));
    v.TA = redondeo(v.ANC + v.AC);
    v.TPP = redondeo(v.PN + v.PNC + v.PC);
    return v;
  }

  // Balance de situación en formato PGC PYMES con dos ejercicios (anterior = dato que se escribe)
  function vBal() {
    const sActual = Motor.saldos(E()), va = balancePGCValores(sActual, S.plan);
    const ant = S.anterior || {};
    const prev = {};
    BALANCE_LINEAS.forEach((l) => { if (l.k) prev[l.k] = l.r && l.r.length ? (Number(ant[l.k]) || 0) : 0; });
    const suma = (keys) => keys.reduce((a, k) => a + (prev[k] || 0), 0);
    prev.ANC = redondeo(suma(["anc1", "anc2", "anc3", "anc4", "anc5", "anc6"]));
    prev.AC = redondeo(suma(["ac1", "ac2", "ac3", "ac4", "ac5", "ac6", "ac7"]));
    prev.TA = redondeo(prev.ANC + prev.AC);
    prev.PN = redondeo(suma(["pn1", "pn2", "pn3", "pn4", "pn5", "pn6", "pn7", "pn8", "pn9", "pn10"]));
    prev.PNC = redondeo(suma(["pnc1", "pnc2", "pnc3", "pnc4", "pnc5"]));
    prev.PC = redondeo(suma(["pc1", "pc2", "pc3", "pc4", "pc5"]));
    prev.TPP = redondeo(prev.PN + prev.PNC + prev.PC);
    const filas = BALANCE_LINEAS.map((l) => {
      if (l.t === "sec") return `<tr class="sec"><th colspan="4">${l.n}</th></tr>`;
      if (l.t === "grp" || l.t === "grp2") return `<tr><th colspan="4" class="${l.t === "grp2" ? "sub2" : ""}">${l.n}</th></tr>`;
      if (l.t === "sub" || l.t === "tot") return `<tr class="${l.t}"><th>${l.n}</th><td></td><td class="num">${numES(va[l.k])}</td><td class="num">${numES(prev[l.k])}</td></tr>`;
      const cuenta = l.r.length ? numES(va[l.k]) : numES(0);
      const anterior = l.r.length === 0 ? `<td class="num">${numES(0)}</td>` : `<td class="num">${dinero(`data-ant="${l.k}"`, ant[l.k])}</td>`;
      return `<tr><td class="ind">${l.n}</td><td class="nota">${l.nota || ""}</td><td class="num">${cuenta}</td>${anterior}</tr>`;
    }).join("");
    const pmC = Motor.planMap(S.plan);
    const ctrlNo = redondeo(Object.keys(sActual).filter((k) => pmC[k] && pmC[k].tipo === ACT_).reduce((a, k) => a + sActual[k], 0) - va.TA);

      <table class="balance"><thead><tr><th>Concepto</th><th class="nota">Nota</th><th class="num">Ejercicio ${S.cfg.ejer || S.cfg.inicio.slice(0, 4)}</th><th class="num">Ejercicio ${Number(S.cfg.ejer || S.cfg.inicio.slice(0, 4)) - 1}</th></tr></thead>
      <tbody>${filas}</tbody></table>
      <p>Cuadre del balance: ${Math.abs(va.TA - va.TPP) < 0.005 ? '<span class="ok">Cuadra (ejercicio actual)</span>' : '<span class="error">NO CUADRA</span>'} · ${Math.abs(prev.TA - prev.TPP) < 0.005 ? '<span class="ok">Cuadra (anterior)</span>' : '<span class="error">Anterior: revisa las cifras</span>'}</p>
      <p class="ayuda">Control de saldos no asignados a una línea: ${numES(ctrlNo)} €</p>
      ${graficoBalance(grupos())}

    const b = Motor.balance(E()), py = Motor.pyg(E()), ant = S.antPyG || {};
    const lineas = [["ventas", "Importe neto de la cifra de negocios"], ["aprovisionamientos", "Aprovisionamientos"],

      ["otrosIngresos", "Otros ingresos de explotación"], ["resExplotacion", "Resultado de explotación"], ["gasFin", "Gastos financieros"],
      ["impuesto", "Impuesto sobre beneficios"], ["resultado", "RESULTADO DEL EJERCICIO"]];
    const fila = (k, t) => {
      const actual = k === "resultado" ? b.resultado : py[k];

  // Semáforo: una sola luz del color que corresponde al criterio
  function semaforoSVG(st) {
    const col = { VERDE: "#2e7d32", AMARILLO: "#f9a825", ROJO: "#c62828" }[st] || "#bdbdbd";
    return `<svg width="26" height="26" viewBox="0 0 26 26" role="img" aria-label="${st}"><circle cx="13" cy="13" r="10" fill="${col}" stroke="#555" stroke-width="0.8"/></svg>`;
  }
  function vInd() {
    const I = Motor.indicadores(E());
    const filas = SEMAFOROS.map(([n, k, mm, v, a]) => {
      const st = Motor.semaforo(I[k], mm, v, a);
      const fmt = k === "fondoManiobra" ? eur(I[k]) : (k === "endeudamiento" || k === "autonomia" || k === "roe" || k === "roa" || k === "margen") ? pctES(I[k]) : (I[k] == null ? "n.a." : numES(I[k]) + (k === "pmc" || k === "pmp" ? " días" : " veces"));
      const umbr = (x) => (k === "endeudamiento" || k === "autonomia" || k === "roe" || k === "roa" || k === "margen") ? (x * 100).toFixed(1).replace(".", ",") + " %" : numES(x);
      return `<tr><td>${n}</td><td class="num">${fmt}</td><td>${mm ? "Mayor es mejor" : "Menor es mejor"}</td>
        <td class="num">${mm ? "≥ " : "≤ "}${umbr(v)}</td><td class="num">${mm ? "≥ " : "≤ "}${umbr(a)}</td><td class="centrado">${semaforoSVG(st)}</td><td>${st === "VERDE" ? "Verde" : st === "AMARILLO" ? "Amarillo" : st === "ROJO" ? "Rojo" : "Sin datos"}</td></tr>`;
    }).join("");
    return `<h2>Indicadores y cuadro de mando</h2>
      <div class="card"><b>Cómo se lee el semáforo</b>
        <ul class="leyenda">
          <li>${semaforoSVG("VERDE")} <b>Verde:</b> el indicador cumple el umbral verde. La situación es buena.</li>
          <li>${semaforoSVG("AMARILLO")} <b>Amarillo:</b> no llega al umbral verde pero sí al amarillo. Hay que vigilarlo.</li>
          <li>${semaforoSVG("ROJO")} <b>Rojo:</b> no alcanza el umbral amarillo. Requiere atención y medidas correctoras.</li>
          <li>${semaforoSVG("")} <b>Gris:</b> no hay datos suficientes para calcularlo.</li>

        <p class="ayuda">En los indicadores de "mayor es mejor" el semáforo verde exige un valor igual o superior al umbral. En los de "menor es mejor" (endeudamiento, periodo medio de cobro), el verde exige un valor igual o inferior. Los umbrales son orientativos.</p></div>

  }

  // ---------- Operaciones: botones de editar y borrar como en el plan ----------
  // Lectura de los campos de una operación (acepta 1.234,56)
  function leerOp() {
    const op = { tipo: $("#tipo").value, fecha: $("#fecha").value, concepto: $("#concepto").value };
    document.querySelectorAll("[data-f]").forEach((el) => {
      const k = el.dataset.f;
      if (k === "tercero") { const t = terceros().find((x) => x.id === Number(el.value)); op.terceroId = t ? t.id : null; op.terceroCuenta = t ? t.cuenta : null; if (t && !op.concepto) op.concepto = t.nombre; return; }
      if (k === "forma") op[k] = el.value;
      else if (k === "iva") op[k] = Number(el.value);
      else if (k === "base") op[k] = el.value.trim() === "" ? null : parseNum(el.value);
      else op[k] = el.value === "" ? null : Number(el.value);
    });
    if (op.pct != null && op.pct > 1) op.pct = op.pct / 100;
    if (op.ret != null && op.ret > 1) op.ret = op.ret / 100;
    return op;
  }

    }).join("");
    const inicial = edit ? edit.lineas.map((l) => ({ c: l.cuenta, d: l.debe, h: l.haber })) : [];

  // ---------- Libro diario: editar y eliminar el asiento de origen ----------
  // Versión imprimible de la pantalla que se ve (sin botones ni controles)
  function vDiario() {
    const todos = Motor.libroDiario(E());
    let td = 0, th = 0, filas = "";
    todos.forEach((a) => {
      const manual = a.num[0] === "O" || a.num[0] === "M";
      a.lineas.forEach((l, i) => {
        td += l.debe; th += l.haber;
        const acc = (i === 0 && manual) ? `<button class="icono" data-libedit="${a.num}" title="Modificar asiento" aria-label="Modificar asiento">${ICO_LAPIZ}</button><button class="icono" data-libdel="${a.num}" title="Eliminar asiento" aria-label="Eliminar asiento">${ICO_PAPELERA}</button>` : "";
        filas += `<tr><td>${i === 0 ? a.num : ""}</td><td>${i === 0 ? a.fecha : ""}</td><td>${i === 0 ? esc(a.concepto) : ""}</td><td>${l.cuenta}</td><td>${esc(nombre(l.cuenta))}</td>
          <td class="num">${l.debe ? numES(l.debe) : ""}</td><td class="num">${l.haber ? numES(l.haber) : ""}</td><td class="acciones">${acc}</td></tr>`;
      });
    });
    return `<h2>Libro diario</h2>
      <p>Cuadre: ${Math.abs(td - th) < 0.005 ? '<span class="ok">OK</span>' : '<span class="error">DESCUADRADO</span>'} · Debe ${eur(td)} · Haber ${eur(th)}</p>

  }

  // ---------- Vista previa, impresión y descarga (sirve también si el navegador bloquea window.print) ----------
  function estiloImprimible() {
    return "body{font-family:Arial,sans-serif;color:#111}table{border-collapse:collapse;width:100%;margin:4px 0}td,th{border:1px solid #bbb;padding:3px 5px;font-size:11px;text-align:left}th{background:#eef2f8}td.num,th.num{text-align:right}h1{font-size:18px;margin:8px 0}h2{font-size:14px;margin:12px 0 4px}.salto{page-break-after:always}.cab-impr{display:flex;align-items:center;gap:8px;font-weight:bold}@page{size:A4;margin:15mm}";
  }
  function descargarHtml(html, titulo) {
    const doc = `<!doctype html><html lang="es"><head><meta charset="utf-8"><title>${esc(titulo)}</title><style>${estiloImprimible()}</style></head><body>${html}</body></html>`;
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([doc], { type: "text/html;charset=utf-8" }));
    a.download = (titulo.replace(/[^\wáéíóúñÁÉÍÓÚÑ -]+/g, "").trim() || "informe") + ".html";
    document.body.appendChild(a); a.click(); a.remove();
  }
  function mostrarPrevia(html, titulo) {
    let d = document.getElementById("dlgPrevia");
    if (!d) { d = document.createElement("dialog"); d.id = "dlgPrevia"; document.body.appendChild(d); }
    if (d.open) d.close();
    d.innerHTML = `<div class="prev-b"><strong>Vista previa: ${esc(titulo)}</strong>
      <span><button id="pvImp" class="dlg-ok">Imprimir</button> <button id="pvDesc">Descargar HTML</button> <button id="pvCerr">Cerrar</button></span></div>
      <div class="prev-doc">${html}</div>
      <p class="prev-pie">Si el navegador no abre el cuadro de impresión, pulsa «Descargar HTML», ábrelo con tu navegador y elige Imprimir → Guardar como PDF.</p>`;
    d.querySelector("#pvImp").onclick = () => { $("#informe").innerHTML = html; window.print(); };
    d.querySelector("#pvDesc").onclick = () => descargarHtml(html, titulo);
    d.querySelector("#pvCerr").onclick = () => d.close();
    d.showModal();
  }
  // Construye el informe con los documentos marcados y lanza la impresión
  function prepararInforme() {
    const sel = [...document.querySelectorAll(".docImp:checked")].map((x) => x.value);
    const desde = $("#impDesde").value, hasta = $("#impHasta").value, ctaD = Number($("#impCtaDesde").value), ctaH = Number($("#impCtaHasta").value);
    const partes = [];
    const cab = (t) => `<div class="cab-impr">${LOGO}<span>Contabilidad PGC PYMES</span></div><h1>${esc(S.cfg.empresa)} · ${esc(t)}</h1><p>CIF ${esc(S.cfg.cif)} · Ejercicio ${S.cfg.inicio.slice(0, 4)}</p>`;
    const ld = Motor.libroDiario(E());
    if (sel.includes("diario")) {
      let f = "";
      ld.forEach((a) => a.lineas.forEach((l, i) => { if (a.fecha < desde || a.fecha > hasta) return;
        f += `<tr><td>${i === 0 ? a.num : ""}</td><td>${i === 0 ? a.fecha : ""}</td><td>${i === 0 ? esc(a.concepto) : ""}</td><td>${l.cuenta}</td><td>${esc(nombre(l.cuenta))}</td><td class="num">${l.debe ? numES(l.debe) : ""}</td><td class="num">${l.haber ? numES(l.haber) : ""}</td></tr>`; }));
      partes.push(cab(`Libro diario ${desde} a ${hasta}`) + `<table><thead><tr><th>Asiento</th><th>Fecha</th><th>Concepto</th><th>Cuenta</th><th>Nombre</th><th class="num">Debe</th><th class="num">Haber</th></tr></thead><tbody>${f}</tbody></table>`);
    }
    if (sel.includes("mayor")) {
      // Todas las cuentas cuyo grupo de tres cifras está en el rango (con movimientos o saldo inicial)
      const p3 = (c) => Number(String(c).slice(0, 3));
      const cuentas = S.plan.filter((p) => p3(p.codigo) >= ctaD && p3(p.codigo) <= ctaH)
        .filter((p) => Number(p.saldo) !== 0 || ld.some((a) => a.lineas.some((l) => l.cuenta === p.codigo)))
        .sort((x, y) => Number(x.codigo) - Number(y.codigo));
      if (!cuentas.length) partes.push(cab(`Libro mayor · cuentas ${ctaD} a ${ctaH}`) + "<p>No hay movimientos ni saldo inicial en ese rango.</p>");
      cuentas.forEach((p) => {
        let saldo = Number(p.saldo) || 0, f = "";
        ld.forEach((a) => a.lineas.forEach((l) => { if (l.cuenta !== p.codigo) return; saldo = redondeo(saldo + l.debe - l.haber);
          f += `<tr><td>${a.num}</td><td>${a.fecha}</td><td>${esc(a.concepto)}</td><td class="num">${l.debe ? numES(l.debe) : ""}</td><td class="num">${l.haber ? numES(l.haber) : ""}</td><td class="num">${numES(saldo)}</td></tr>`; }));
        partes.push(`<h2>Cuenta ${p.codigo} · ${esc(p.nombre)}</h2><table><thead><tr><th>Asiento</th><th>Fecha</th><th>Concepto</th><th class="num">Debe</th><th class="num">Haber</th><th class="num">Saldo</th></tr></thead><tbody><tr><td colspan="5"><b>Saldo inicial</b></td><td class="num">${numES(Number(p.saldo) || 0)}</td></tr>${f}</tbody></table>`);
      });
      if (cuentas.length) partes.unshift(cab(`Libro mayor · cuentas ${ctaD} a ${ctaH}`));
    }
    if (sel.includes("sumas")) {
      const acc = {}, s = Motor.saldos(E());
      ld.forEach((a) => a.lineas.forEach((l) => { acc[l.cuenta] = acc[l.cuenta] || { d: 0, h: 0 }; acc[l.cuenta].d += l.debe; acc[l.cuenta].h += l.haber; }));
      let f = ""; Object.keys(acc).map(Number).sort((a, b) => a - b).forEach((c) => { const sf = redondeo(s[c] || 0);
        f += `<tr><td>${c}</td><td>${esc(nombre(c))}</td><td class="num">${numES(acc[c].d)}</td><td class="num">${numES(acc[c].h)}</td><td class="num">${sf >= 0 ? numES(sf) : ""}</td><td class="num">${sf < 0 ? numES(-sf) : ""}</td></tr>`; });
      partes.push(cab("Balance de sumas y saldos") + `<table><thead><tr><th>Cuenta</th><th>Nombre</th><th class="num">Debe</th><th class="num">Haber</th><th class="num">Saldo deudor</th><th class="num">Saldo acreedor</th></tr></thead><tbody>${f}</tbody></table>`);
    }
    if (sel.includes("balance")) {
      const va = balancePGCValores(Motor.saldos(E()), S.plan), ant = S.anterior || {};
      const f = BALANCE_LINEAS.map((l) => l.t === "sec" ? `<tr><th colspan="4">${l.n}</th></tr>` : (l.t === "grp" || l.t === "grp2") ? `<tr><th colspan="4">${l.n}</th></tr>` :
        (l.t === "sub" || l.t === "tot") ? `<tr><th>${l.n}</th><td></td><td class="num">${numES(va[l.k])}</td><td></td></tr>` :
        `<tr><td>${l.n}</td><td>${l.nota || ""}</td><td class="num">${numES(va[l.k] || 0)}</td><td class="num">${l.r && l.r.length ? numES(Number(ant[l.k]) || 0) : ""}</td></tr>`).join("");

  // ---------- Modelos 111, 130 y 190 ----------
  function trimestreDe(fecha) { return Math.floor((Number(fecha.slice(5, 7)) - 1) / 3) + 1; }
  function vIrpf() {
    const y = S.cfg.inicio.slice(0, 4), ld = Motor.libroDiario(E());
    const r111 = [1, 2, 3, 4].map((q) => {
      let base = 0, ret = 0;
      S.ops.forEach((o) => {
        if (!o.fecha || o.fecha.slice(0, 4) !== y || trimestreDe(o.fecha) !== q) return;
        const tiene = o.tipo === "NOMINA" || ((o.tipo === "COMPRA" || o.tipo === "GASTO") && Number(o.ret) > 0);
        if (!tiene) return;
        base += Number(o.base) || 0; ret += redondeo((Number(o.base) || 0) * (Number(o.ret) || 0));
      });
      return { q, base: redondeo(base), ret: redondeo(ret) };
    });
    let pagos = 0, rend130 = [];
    const r130 = [1, 2, 3, 4].map((q) => {
      const fin = `${y}-${String(q * 3).padStart(2, "0")}-31`;
      let ing = 0, gas = 0, retSop = 0;
      ld.forEach((a) => { if (a.fecha.slice(0, 4) !== y || a.fecha > fin || a.origen === "liq") return; a.lineas.forEach((l) => {
        const g = Number(String(l.cuenta).slice(0, 3));
        if (g >= 700 && g < 800) ing += l.haber - l.debe;
        if (g >= 600 && g < 700 && ![630, 633, 639].includes(g)) gas += l.debe - l.haber;
        if (l.cuenta === S.cfg.ret_cli) retSop += l.debe - l.haber; }); });
      const rend = redondeo(ing - gas), pct = redondeo(0.2 * Math.max(rend, 0));
      const acum = redondeo(Math.max(0, pct - retSop)), pago = redondeo(Math.max(0, acum - pagos));
      pagos = redondeo(pagos + pago);
      return { q, ing: redondeo(ing), gas: redondeo(gas), rend, pct, retSop: redondeo(retSop), pago };
    });
    const perceptores = {};
    S.ops.forEach((o) => {
      if (!o.fecha || o.fecha.slice(0, 4) !== y) return;
      const esNom = o.tipo === "NOMINA", esProf = (o.tipo === "COMPRA" || o.tipo === "GASTO") && Number(o.ret) > 0;
      if (!esNom && !esProf) return;
      const clave = esNom ? "A" : "E", k = clave + "|" + (o.concepto || "Sin nombre");
      perceptores[k] = perceptores[k] || { nombre: o.concepto || "Sin nombre", clave: esNom ? "A · Rendimientos del trabajo" : "E · Actividades profesionales", base: 0, ret: 0, tipo: Number(o.ret) || 0 };
      perceptores[k].base += Number(o.base) || 0; perceptores[k].ret += redondeo((Number(o.base) || 0) * (Number(o.ret) || 0));
    });
    const lista = Object.values(perceptores);
    const tb = lista.reduce((a, x) => a + x.base, 0), tr = lista.reduce((a, x) => a + x.ret, 0);
    const f = (v) => eur(v);
    return `<h2>Modelos IRPF: 111, 130 y 190 (resumen orientativo)</h2>

        <tr class="tot"><th>Total año</th><td class="num">${f(r111.reduce((a, x) => a + x.base, 0))}</td><td class="num">${f(r111.reduce((a, x) => a + x.ret, 0))}</td></tr></tbody></table></div>
      <div class="card"><b>Modelo 130 · pago fraccionado (empresario individual)</b>
        ${S.cfg.es_autonomo ? `<table><thead><tr><th>Trimestre</th><th class="num">Ingresos acumulados</th><th class="num">Gastos acumulados</th><th class="num">Rendimiento</th><th class="num">20 %</th><th class="num">Retenciones de clientes</th><th class="num">A ingresar</th></tr></thead><tbody>
        ${r130.map((x) => `<tr><td>${x.q}T</td><td class="num">${f(x.ing)}</td><td class="num">${f(x.gas)}</td><td class="num">${f(x.rend)}</td><td class="num">${f(x.pct)}</td><td class="num">${f(x.retSop)}</td><td class="num"><b>${f(x.pago)}</b></td></tr>`).join("")}
        <tr class="tot"><th>Total año</th><td></td><td></td><td></td><td></td><td></td><td class="num">${f(r130.reduce((a, x) => a + x.pago, 0))}</td></tr></tbody></table>` : '<p class="ayuda">Este modelo solo aplica a empresarios individuales. Activa la casilla correspondiente en Empresa y parámetros.</p>'}</div>
      <div class="card"><b>Modelo 190 · resumen anual de retenciones</b>

  // Renumera operaciones y asientos manuales por fecha, sin huecos; actualiza las anulaciones

  // Apuntes de una cuenta, con una clave estable para marcarlos (no depende del número de asiento)

  // Importe en letras (castellano)
  function hasta999(n) {
    const C = ["", "ciento", "doscientos", "trescientos", "cuatrocientos", "quinientos", "seiscientos", "setecientos", "ochocientos", "novecientos"];
    const D = ["", "diez", "veinte", "treinta", "cuarenta", "cincuenta", "sesenta", "setenta", "ochenta", "noventa"];
    const U = ["", "uno", "dos", "tres", "cuatro", "cinco", "seis", "siete", "ocho", "nueve"];
    const E10 = ["diez", "once", "doce", "trece", "catorce", "quince", "dieciséis", "diecisiete", "dieciocho", "diecinueve"];
    const V = ["veinte", "veintiuno", "veintidós", "veintitrés", "veinticuatro", "veinticinco", "veintiséis", "veintisiete", "veintiocho", "veintinueve"];
    if (n === 0) return ""; if (n === 100) return "cien";
    const out = [], c = Math.floor(n / 100), r = n % 100;
    if (c) out.push(C[c]);
    if (r >= 10 && r < 20) out.push(E10[r - 10]);
    else if (r >= 20 && r < 30) out.push(V[r - 20]);
    else { const d = Math.floor(r / 10), u = r % 10; if (d) out.push(u ? D[d] + " y " + U[u] : D[d]); else if (u) out.push(U[u]); }
    return out.join(" ");
  }
  const conUn = (t) => (t.endsWith("uno") ? t.slice(0, -3) + "ún" : t);
  function enteroLetras(n) {
    if (n === 0) return "cero";

    if (mil) out.push(mil === 1 ? "un millón" : conUn(hasta999(mil)) + " millones");
    if (mi) out.push(mi === 1 ? "mil" : conUn(hasta999(mi)) + " mil");
    if (r) out.push(hasta999(r));
    return out.join(" ");
  }
