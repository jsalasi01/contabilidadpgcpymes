      const modo = $("#enModo").value, D = modo === "caso" ? caso() : modo === "caso2" ? caso2() : nuevo();
      D.cfg = Object.assign({}, D.cfg, { empresa: nombre, cif: $("#enCif").value.trim(), inicio: $("#enIni").value, fin: $("#enFin").value, fechaApertura: $("#enIni").value });
      const anio = Number((D.cfg.inicio || "").slice(0, 4)) || new Date().getFullYear();
      localStorage.setItem(ejKey(id, anio), JSON.stringify(D));
      const l = leerIndice(); l.push({ id, nombre, cif: D.cfg.cif, ejercicios: [{ anio, estado: "abierto" }] }); guardarIndice(l);
      window._formEmp = false;
      abrirEjercicio(id, anio); render();
    };
    document.querySelectorAll("[data-abrir]").forEach((b) => b.onclick = () => { abrirEmpresa(b.dataset.abrir); render(); });
    document.querySelectorAll("[data-conf]").forEach((b) => b.onclick = () => { abrirEmpresa(b.dataset.conf); render(); });
    document.querySelectorAll("[data-borrar]").forEach((b) => b.onclick = async () => {
      const id = b.dataset.borrar, e = buscarEmp(id);
      if (!await confirmar(`¿Borrar la empresa «${e ? e.nombre : ""}» y todos sus ejercicios? Esta acción no se puede deshacer.`)) return;
      (e && e.ejercicios || []).forEach((x) => localStorage.removeItem(ejKey(id, x.anio)));
      guardarIndice(leerIndice().filter((x) => x.id !== id));
      if (EMP === id) EMP = null;
      render();
    });
  }

  // ===================== Selección de preguntas del cuestionario (banco de 300) =====================
  function nuevoCuestionarioIds(ids) {
    const sel = BANCO_AUT().filter((x) => ids.includes(x.id));
    window._cuest = sel.map((x) => {
      const perm = x.o.map((_, k) => k);
      for (let i = perm.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [perm[i], perm[j]] = [perm[j], perm[i]]; }
      return { id: x.id, q: x.q, o: perm.map((k) => x.o[k]), ok: perm.indexOf(x.ok) };
    });
    window._aut = {}; window._pista = {}; window._corr = false; window._infAut = false;
    window._cuestN = (window._cuestN || 1) + 1;
  }
  function vElegir() {
    const sel = new Set(window._sel || []), total = BANCO_AUT().length;
    const f = (window._filtroPreg || "").trim().toLowerCase();
    const lista = BANCO_AUT().filter((x) => !f || x.q.toLowerCase().includes(f) || x.id.toLowerCase() === f);
    return `<div class="card"><b>Seleccionadas: ${sel.size} de ${total}</b>
      <p class="ayuda">Marca las preguntas que quieres en el cuestionario y pulsa Generar. Puedes buscar por texto (por ejemplo «IVA») o por identificador (por ejemplo «C12»).</p>
      <label>Buscar<input id="filtroPreg" class="campoLargo" value="${esc(window._filtroPreg || "")}" placeholder="Texto de la pregunta o identificador"></label>
      <p><button id="genSel" ${sel.size ? "" : "disabled"}>Generar cuestionario con las ${sel.size} seleccionadas</button>
      <button id="marcarAzar">Marcar 50 al azar</button> <button id="quitarTodas">Quitar todas</button></p></div>
      <table class="pyg"><thead><tr><th>Sel.</th><th>Id</th><th>Pregunta</th></tr></thead><tbody>
      ${lista.map((x) => `<tr><td><input type="checkbox" data-sel="${x.id}" ${sel.has(x.id) ? "checked" : ""}></td><td>${x.id}</td><td>${esc(x.q)}</td></tr>`).join("")}
      </tbody></table>`;
  }
  // Cabecera de modo (aleatorio / elegir) para la pantalla de autoevaluación
  function cabeceraModoAut() {
    const modo = window._modoAut || "azar";
    return `<div class="card"><b>Cómo generar el cuestionario:</b>
      <button id="modoAzar" ${modo === "azar" ? "disabled" : ""}>Aleatorio</button>
      <button id="modoElegir" ${modo === "elegir" ? "disabled" : ""}>Elegir preguntas</button></div>`;
  }
  // Sustituye la función vAut: mantiene el cuestionario, la pista y el informe, y añade el modo de selección
  function vAut() {
    if (window._infAut) return informeAut();
    if ((window._modoAut || "azar") === "elegir") return `<h2>Autoevaluación · elegir preguntas</h2>${cabeceraModoAut()}${vElegir()}`;
    const cu = cuestActual(), r = window._aut || {}, p = window._pista || {}, corr = !!window._corr;
    const preguntas = cu.map((q, i) => {
      const opciones = q.o.map((o, j) => `<label class="opcion"><input type="radio" name="p${i}" value="${j}" ${r[i] === j ? "checked" : ""}><span>${esc(o)}</span></label>`).join("");
      const pista = p[i] ? `<div class="pista"><b>Pista:</b> ${esc(PISTAS[q.id])} <span class="ayuda">(esta pregunta vale 0,8 puntos)</span></div>` : `<button data-pista="${i}">Pista (quita el 20 % del valor)</button>`;
      const fb = corr && r[i] != null ? (r[i] === q.ok ? '<p class="ok">Correcto</p>' : '<p class="error">Incorrecto. La respuesta correcta es: ' + esc(q.o[q.ok]) + "</p>") : "";
      return `<div class="card pregunta"><b>${i + 1}. ${esc(q.q)}</b>${opciones}${pista}${fb}</div>`;
    }).join("");
    let nomG = "", mailG = ""; try { nomG = localStorage.getItem("pgc-alumno-nombre") || ""; mailG = localStorage.getItem("pgc-alumno-email") || ""; } catch (e) {}
    return `<h2>Autoevaluación · cuestionario nº ${window._cuestN || 1} (${cu.length} preguntas)</h2>
      <div class="card"><h3>Datos del alumno</h3>
        <label>Nombre y apellidos<input id="autNombre" value="${esc(nomG)}" placeholder="Nombre y apellidos"></label>
        <label>Correo electrónico<input id="autEmail" type="email" value="${esc(mailG)}" placeholder="correo@ejemplo.com"></label>
        <p class="ayuda">Estos datos aparecerán en el archivo de respuestas que envías al profesor.</p>
      </div>
      ${cabeceraModoAut()}
      <div class="card"><label>Número de preguntas al azar (5 a 300)<input id="nPreg" type="number" min="5" max="300" value="${window._nPreg || cu.length}"></label>
        <button id="nuevoCuest">Generar cuestionario aleatorio</button></div>
      <button id="corregir">Corregir</button> <button id="verInforme">Ver informe final</button>
      ${corr ? `<b> Puntuación parcial: ${numES(puntuacionAut().total)} de ${cu.length} · nota sobre 10: ${numES(puntuacionAut().nota)}</b>` : ""}
      ${preguntas}
      <button id="corregir2">Corregir</button> <button id="verInforme2">Ver informe final</button>`;
  }

  // ---------- Operaciones auxiliares ----------
  function descargar(nombreArchivo, texto, tipo) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([texto], { type: tipo }));
    a.download = nombreArchivo; a.click();
  }
  function aCSV() {
    const filas = ["Asiento;Fecha;Concepto;Cuenta;Nombre;Debe;Haber"];
    Motor.libroDiario(E()).forEach((a) => a.lineas.forEach((l) => filas.push([a.num, a.fecha, a.concepto, l.cuenta, nombre(l.cuenta), numES(l.debe), numES(l.haber)].map((x) => String(x).replace(/;/g, ",")).join(";"))));
    return "\ufeff" + filas.join("\r\n");
  }

  // ---------- Eventos ----------
  function enlazar() {
    enlazarFinal();
    const t = $("#tipo");
    if (t) t.onchange = () => { window._tipo = t.value; editId = null; render(); };
    const g = $("#guardarOp");
    if (g) g.onclick = () => {
      const op = leerOp();
      if (!op.fecha) return ($("#msgOp").textContent = "Escribe la fecha.");
      if (!op.base) return ($("#msgOp").textContent = "Escribe la base o el importe.");
      if (editId) {
        const old = S.ops.find((o) => o.id === editId);
        if (!Motor.puedeModificar(E(), old)) return ($("#msgOp").textContent = "Periodo cerrado: no se puede modificar.");
        Object.assign(old, op);
      } else { op.id = S.nextOp++; S.ops.push(op); }
      editId = null; guardar(); render();
    };
    const co = $("#cancelOp"); if (co) co.onclick = () => { editId = null; render(); };
    document.querySelectorAll("[data-edit]").forEach((b) => b.onclick = () => { editId = Number(b.dataset.edit); window._tipo = null; render(); });
    document.querySelectorAll("[data-del]").forEach((b) => b.onclick = async () => {
      const o = S.ops.find((x) => x.id === Number(b.dataset.del));
      if (!Motor.puedeModificar(E(), o)) return avisar("Periodo cerrado: usa Anular.");
      if (await confirmar("¿Borrar esta operación?")) { S.ops = S.ops.filter((x) => x.id !== o.id); guardar(); render(); }
    });
    document.querySelectorAll("[data-anular]").forEach((b) => b.onclick = async () => {
      const motivo = await pedir("Motivo de la anulación:", ""); if (!motivo) return;
      const fecha = await pedir("Fecha de la anulación (aaaa-mm-dd, en un periodo abierto):", new Date().toISOString().slice(0, 10), /^\d{4}-\d{2}-\d{2}$/, "Escribe la fecha como aaaa-mm-dd, por ejemplo 2026-11-15."); if (!fecha) return;
      try {
        const e = E(); Motor.anularOperacion(e, Number(b.dataset.anular), fecha, motivo);
        S.ops = e.ops; S.hist = e.historial; S.nextOp = e.nextId; guardar(); render();
        avisar("Anulación registrada. Ahora registra la operación correcta.");
      } catch (err) { avisar(err.message); }
    });
    document.querySelectorAll("[data-cfg]").forEach((el) => el.onchange = () => { const k = el.dataset.cfg; S.cfg[k] = el.type === "number" ? Number(el.value) : el.value; guardar(); });
    document.querySelectorAll("[data-cfgb]").forEach((el) => el.onchange = () => { S.cfg[el.dataset.cfgb] = el.checked; guardar(); });
    document.querySelectorAll("[data-saldo]").forEach((el) => el.onchange = () => { const p = S.plan.find((x) => x.codigo === Number(el.dataset.saldo)); p.saldo = parseNum(el.value); guardar(); render(); });
    const fgs = $("#filtroGrupo"); if (fgs) fgs.onchange = () => { window._fg = fgs.value; window._fsg = "all"; render(); };
    const fss = $("#filtroSubgrupo"); if (fss) fss.onchange = () => { window._fsg = fss.value; render(); };
    const ad = $("#addc");
    if (ad) ad.onclick = () => {
      const cod = Number($("#pc").value), nom = $("#pn").value.trim();
      const s = String(cod);
      if (!cod || s.length < 3 || s.length > (S.cfg.max_digitos || 10)) return ($("#msgc").textContent = "Código no válido (de 3 a 10 cifras).");
      if (S.plan.some((p) => p.codigo === cod)) return ($("#msgc").textContent = "Ya existe una cuenta con ese código.");
      if (s.length > 3 && !S.plan.some((p) => p.codigo === Number(s.slice(0, 3)))) return ($("#msgc").textContent = "La subcuenta necesita primero su cuenta de 3 cifras.");
      if (!nom) return ($("#msgc").textContent = "Escribe el nombre.");
      S.plan.push({ codigo: cod, nombre: nom, tipo: $("#pt").value, plazo: $("#pz").value, saldo: 0 });
      ordenarPlan(); guardar(); render();
    };
    document.querySelectorAll("[data-delcta]").forEach((b) => b.onclick = async () => {
      const c = Number(b.dataset.delcta);
      if (Motor.libroDiario(E()).some((a) => a.lineas.some((l) => l.cuenta === c))) return avisar("La cuenta tiene apuntes: no se puede eliminar.");
      if (S.plan.some((p) => p.codigo !== c && String(p.codigo).startsWith(String(c)))) return avisar("La cuenta tiene subcuentas: elimínalas primero.");
      if (await confirmar("¿Eliminar la cuenta " + c + "?")) { S.plan = S.plan.filter((p) => p.codigo !== c); guardar(); render(); }
    });
    document.querySelectorAll("[data-modcta]").forEach((b) => b.onclick = async () => {
      const c = Number(b.dataset.modcta), p = S.plan.find((x) => x.codigo === c);
      const nn = await pedir("Nombre:", p.nombre); if (nn == null) return;
      const tp = await pedir("Tipo (Activo, Pasivo, Patrimonio neto, Gasto o Ingreso):", p.tipo, /^(Activo|Pasivo|Patrimonio neto|Gasto|Ingreso)$/i, "Usa uno de: Activo, Pasivo, Patrimonio neto, Gasto o Ingreso."); if (tp == null) return;
      const pz = await pedir("Plazo (Corriente, No corriente o n.a.):", p.plazo, /^(Corriente|No corriente|n\.a\.)$/i, "Usa Corriente, No corriente o n.a."); if (pz == null) return;
      p.nombre = nn.trim() || p.nombre; p.tipo = tp.trim() || p.tipo; p.plazo = pz.trim() || p.plazo;
      guardar(); render();
    });
    document.querySelectorAll("[data-modinm]").forEach((b) => b.onclick = () => { editInm = Number(b.dataset.modinm); render(); });
    document.querySelectorAll("[data-delinm]").forEach((b) => b.onclick = async () => { if (await confirmar("¿Borrar este elemento?")) { S.inm = S.inm.filter((x) => x.id !== Number(b.dataset.delinm)); guardar(); render(); } });
    const gi = $("#guardarInm");
    if (gi) gi.onclick = () => {
      const metodo = $("#imet").value, tipoTabla = $("#itab").value;
      const tab = TABLA_AM.find((t) => t[1] === tipoTabla);
      const el = { desc: $("#idesc").value.trim(), cta: Number($("#icta").value), ctaAm: Number($("#ictam").value), fecha: $("#ifecha").value,
        coste: parseNum($("#icoste").value), residual: parseNum($("#ires").value), vida: tab ? tab[3] : Number($("#ivida").value),
        amAnterior: parseNum($("#iam").value), metodo, tipoTabla: tab ? tab[1] : "", grupo: tab ? tab[0] : "",
        unidadesTotales: parseNum($("#iutot").value) || 0, unidadesAnio: parseNum($("#iuan").value) || 0, unidad: $("#iuni").value.trim() || "unidades" };
      if (!el.desc || !(el.coste > 0) || !el.fecha) return ($("#msgInm").textContent = "Descripción, coste y fecha son obligatorios.");
      if ((metodo === "tabla" || metodo === "degresivo") && !tab) return ($("#msgInm").textContent = "Elige el tipo de elemento de la tabla para este método.");
      if (metodo === "degresivo" && GRUPOS_SIN_DEGRESIVO.includes(el.grupo)) return ($("#msgInm").textContent = "Edificios, mobiliario y enseres no pueden amortizarse con el método degresivo.");
      if (metodo === "uso" && !(el.unidadesTotales > 0)) return ($("#msgInm").textContent = "Indica las unidades totales estimadas para el método de uso.");
      if (metodo !== "uso" && !(el.vida > 0)) return ($("#msgInm").textContent = "Indica la vida útil en años.");
      if (editInm) Object.assign(S.inm.find((x) => x.id === editInm), el);
      else { el.id = S.nextInm++; S.inm.push(el); }
      editInm = null; guardar(); render();
    };
    const ci = $("#cancelInm"); if (ci) ci.onclick = () => { editInm = null; render(); };
    document.querySelectorAll("[data-per]").forEach((el) => el.onchange = () => { const q = el.dataset.per; S.periodos[q] = Object.assign(S.periodos[q] || {}, { estado: el.value }); guardar(); render(); });
    document.querySelectorAll("[data-perirpf]").forEach((el) => el.onchange = () => { const q = el.dataset.perirpf; S.periodosIrpf = S.periodosIrpf || {}; S.periodosIrpf[q] = Object.assign(S.periodosIrpf[q] || {}, { estado: el.value }); guardar(); render(); });
    document.querySelectorAll("[data-perirpff]").forEach((el) => el.onchange = () => { const q = el.dataset.perirpff; S.periodosIrpf = S.periodosIrpf || {}; S.periodosIrpf[q] = Object.assign(S.periodosIrpf[q] || {}, { fecha: el.value }); guardar(); });
    document.querySelectorAll("[data-perf]").forEach((el) => el.onchange = () => { const q = el.dataset.perf; S.periodos[q] = Object.assign(S.periodos[q] || {}, { fecha: el.value }); guardar(); });
    const addL = $("#addLinea"); if (addL) addL.onclick = () => { tmpLineas++; render(); };
    document.querySelectorAll("[data-lc]").forEach((el) => el.onchange = () => { const i = el.dataset.lc, p = S.plan.find((x) => x.codigo === Number(el.value)); document.querySelector(`[data-ln="${i}"]`).textContent = p ? p.nombre : (el.value ? "¡No existe!" : ""); });
    const gm = $("#guardarMan");
    if (gm) gm.onclick = () => {
      const lineas = [];
      document.querySelectorAll("[data-lc]").forEach((el) => {
        const i = el.dataset.lc, c = Number(el.value), d = parseNum($(`[data-ld="${i}"]`).value), h = parseNum($(`[data-lh="${i}"]`).value);
        if (c && (d || h)) lineas.push({ cuenta: c, debe: Motor.r2(d), haber: Motor.r2(h) });
      });
      const d = Motor.r2(lineas.reduce((a, l) => a + l.debe, 0)), h = Motor.r2(lineas.reduce((a, l) => a + l.haber, 0));
      if (!lineas.length) return ($("#msgMan").textContent = "Escribe al menos una línea.");
      if (d !== h) return ($("#msgMan").textContent = `No cuadra: debe ${eur(d)} y haber ${eur(h)}.`);
      if (window._editMan) { const m = S.man.find((x) => x.num === window._editMan); if (m) Object.assign(m, { fecha: $("#mfecha").value, concepto: $("#mconc").value, lineas }); window._editMan = null; }
      else S.man.push({ num: S.nextMan++, fecha: $("#mfecha").value, concepto: $("#mconc").value, lineas });
      tmpLineas = 2; guardar(); pagina = "man"; render();
    };
    document.querySelectorAll("[data-delman]").forEach((b) => b.onclick = () => { S.man = S.man.filter((m) => m.num !== Number(b.dataset.delman)); guardar(); render(); });
    document.querySelectorAll("[data-mem]").forEach((el) => el.onchange = () => { S.memoria = S.memoria || {}; S.memoria[el.dataset.mem] = el.value; guardar(); });
    document.querySelectorAll("[data-memrest]").forEach((b) => b.onclick = () => { if (S.memoria) delete S.memoria[b.dataset.memrest]; guardar(); render(); });
    const cm = $("#cuentaMayor"); if (cm) cm.onchange = () => { mayorCta = Number(cm.value); render(); };
    const con = $("#conciliar");
    if (con) con.onclick = () => { window._con = Motor.conciliar(E(), parsearExtracto($("#extracto").value), Number($("#tol").value) || 0); render(); };
    document.querySelectorAll("[data-prev]").forEach((el) => el.onchange = () => { S.presupuesto[el.dataset.prev] = el.value === "" ? null : parseNum(el.value); guardar(); render(); });
    const csv = $("#csv"); if (csv) csv.onclick = () => descargar("libro_diario.csv", aCSV(), "text/csv");
    const ej = $("#ejemplo"); if (ej) ej.onclick = async () => { if (await confirmar("Se cargará el caso práctico y se sustituirán los datos actuales. ¿Continuar?")) { S = caso(); guardar(); pagina = "ops"; render(); avisar("Caso práctico cargado: " + S.ops.length + " operaciones y " + S.plan.filter((p) => Number(p.saldo)).length + " saldos iniciales. Revisa Operaciones, Libro diario y Balance."); } };
    const ej2 = $("#ejemplo2"); if (ej2) ej2.onclick = async () => { if (await confirmar("Se cargará el segundo caso práctico y se sustituirán los datos actuales. ¿Continuar?")) { S = caso2(); guardar(); pagina = "ops"; render(); avisar("Segundo caso cargado: 10 operaciones. Revisa Operaciones, Libro diario y Balance."); } };
    const rs = $("#reset"); if (rs) rs.onclick = async () => { if (await confirmar("Se borrarán todos los datos. ¿Continuar?")) { S = nuevo(); guardar(); render(); } };
    const ex = $("#exportar"); if (ex) ex.onclick = () => exportarTodo();
    const alum = $("#alumnoNombre"); if (alum) alum.onchange = () => nombreAlumno();
    const es = $("#exportarSel"); if (es) es.onclick = () => exportarSeleccion();
    const er = $("#exportarResp"); if (er) er.onclick = () => exportarRespuestas();
    const ev = $("#enviarResp"); if (ev) ev.onclick = () => exportarRespuestas();
    const an = $("#autNombre"); if (an) an.onchange = () => { try { localStorage.setItem("pgc-alumno-nombre", an.value.trim()); } catch (e) {} };
    const ae = $("#autEmail"); if (ae) ae.onchange = () => { try { localStorage.setItem("pgc-alumno-email", ae.value.trim()); } catch (e) {} };
    const im = $("#importar");
    if (im) im.onchange = () => { const r = new FileReader(); r.onload = async () => {
      let obj; try { obj = JSON.parse(r.result); } catch (e) { avisar("El archivo no es válido.", "error"); return; }
      const completa = obj && obj.app === "contabilidad-pgc";
      if (!(await confirmar(completa ? "Las empresas de la copia con el mismo identificador se sustituirán. ¿Continuar?" : "Se sustituirán los datos del ejercicio abierto por los de la copia. ¿Continuar?"))) return;
      restaurarCopia(obj); render(); }; r.readAsText(im.files[0]); };
  }
  function ordenarPlan() {
    const k = (c) => String(c).slice(0, 3) + String(String(c).length).padStart(2, "0") + String(c).padStart(10, "0");
    S.plan.sort((a, b) => (k(a.codigo) < k(b.codigo) ? -1 : 1));
  }

  // Guardar la operación: validar con el motor antes de registrar
  document.addEventListener("DOMContentLoaded", () => {
    $("#logo").innerHTML = LOGO;
    migrarDatos();
    render();
  });
})();

  window.addEventListener("beforeunload", (ev) => {
    try { if (localStorage.getItem("pgc-sin-copia") === "1") { ev.preventDefault(); ev.returnValue = ""; } } catch (e) {}
  });
</script>
</body>
